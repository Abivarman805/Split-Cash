<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SplitMate - Group Expenses & Debt Simplification</title>
    <meta name="description" content="Smart group expense tracker and debt simplification engine with AI-powered receipt scanning and expense parsing." />
    
    <!-- PWA & Theme Settings -->
    <meta name="theme-color" content="#0b151c" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple iOS Safari Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SplitMate" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Open Graph & Social -->
    <meta property="og:title" content="SplitMate - Group Expenses & Debt Simplification" />
    <meta property="og:description" content="Smart group expense tracker and debt simplification engine with AI-powered receipt scanning." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('✅ SplitMate PWA Service Worker active:', reg.scope);
            })
            .catch((err) => {
              console.warn('⚠️ PWA Service Worker registration warning:', err);
            });
        });
      }
    </script>
  </body>
</html>
